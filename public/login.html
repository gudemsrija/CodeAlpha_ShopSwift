<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your CodeAlpha Supply Co. account.">
  <title>Sign in — CodeAlpha Supply Co.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="auth-section">
      <div class="container">
        <div class="auth-shell">
          <div class="auth-form-panel">
            <span class="eyebrow">Welcome back</span>
            <h1>Good to see you.</h1>
            <p class="auth-subtitle">Sign in to check out faster and keep every order in one place.</p>

            <div class="form-error" id="auth-error" role="alert"></div>

            <form class="auth-form" id="login-form" novalidate>
              <div class="form-field">
                <label for="login-email">Email address</label>
                <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
              </div>
              <div class="form-field">
                <label for="login-password">Password</label>
                <div class="password-wrap">
                  <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                  <button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password">Show</button>
                </div>
              </div>
              <button class="button button-accent button-wide auth-submit" type="submit" id="login-submit">Sign in</button>
            </form>

            <p class="auth-switch">New here? <a href="/register" id="register-link">Create an account</a></p>

            <ul class="auth-benefits">
              <li>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
                Faster checkout, every time
              </li>
              <li>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
                A clear record of all your orders
              </li>
            </ul>
          </div>

          <div class="auth-visual">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1000&q=85" alt="Drift canvas backpack" loading="lazy">
            <div class="auth-visual-content">
              <span class="auth-visual-mark">CA</span>
              <blockquote>“Buy less. Choose well. Make it <em>last.</em>”</blockquote>
              <div class="auth-visual-footer">
                <div>
                  <div class="auth-visual-stars">★★★★★</div>
                  <span>4.8 from 1,200+ happy customers</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div class="toast-root" id="toast-root"></div>
</body>
</html>
