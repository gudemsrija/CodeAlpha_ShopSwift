<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover considered everyday essentials at CodeAlpha Supply Co.">
  <title>Product — CodeAlpha Supply Co.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/product.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#product-detail">Skip to product</a>
  <div id="site-header"></div>

  <main>
    <section class="product-detail-section">
      <div class="container">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb">
          <a href="/">Home</a><span>/</span><a href="/">Shop</a><span>/</span><span>Product</span>
        </nav>

        <div class="product-detail-grid" id="product-detail">
          <div class="page-loading" style="grid-column: 1 / -1;">
            <span class="spinner" aria-label="Loading product"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="related-section" id="related-section" hidden>
      <div class="container">
        <div class="related-header">
          <div>
            <span class="eyebrow">Keep exploring</span>
            <h2>You may also like</h2>
          </div>
          <a class="link-arrow" href="/">
            View all
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </a>
        </div>
        <div class="product-grid product-grid-related" id="related-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div class="toast-root" id="toast-root"></div>
</body>
</html>
