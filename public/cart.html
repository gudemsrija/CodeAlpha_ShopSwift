<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review your CodeAlpha Supply Co. shopping bag and continue to checkout.">
  <title>Your bag — CodeAlpha Supply Co.</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/cart.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#cart-root">Skip to shopping bag</a>
  <div id="site-header"></div>

  <main>
    <section class="page-intro">
      <div class="container">
        <span class="eyebrow">Almost yours</span>
        <h1>Your shopping bag.</h1>
        <p>Good choices live here. Review your pieces, adjust quantities, and check out when you are ready.</p>
      </div>
    </section>

    <section class="cart-section">
      <div class="container" id="cart-root">
        <div class="page-loading">
          <span class="spinner" aria-label="Loading shopping bag"></span>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div class="toast-root" id="toast-root"></div>
</body>
</html>
